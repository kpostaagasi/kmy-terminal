name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      # node-pty yerel derlemesi platforma göre değişir; testler onu kullanmaz.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # node-pty prebuild'ındaki spawn-helper'a çalıştırma izni (macOS/Linux); Windows'ta etkisiz.
      - run: npm run postinstall || true
        shell: bash
      - run: npm test
        shell: bash
      - name: Sunucu duman testi
        shell: bash
        run: |
          export BORSA_DATA_DIR="$RUNNER_TEMP/kmy-data" PORT=7499
          node server/index.js > "$RUNNER_TEMP/srv.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:7499/ && break; sleep 0.5; done
          curl -fs -o /dev/null http://127.0.0.1:7499/ || { cat "$RUNNER_TEMP/srv.log"; exit 1; }
      - run: npm audit --omit=dev --audit-level=high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks (tüm geçmiş)
        run: |
          curl -fsSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner

  build:
    name: build (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: dmg }
          - { os: ubuntu-latest, target: appimage }
          - { os: windows-latest, target: exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - name: macOS DMG (imzasız, ad-hoc)
        if: matrix.target == 'dmg'
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run postinstall && ./scripts/build-dmg.sh
      - name: Linux AppImage (imzasız)
        if: matrix.target == 'appimage'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 file && ./scripts/build-appimage.sh
      - name: Windows kurulum .exe (imzasız, NSIS)
        if: matrix.target == 'exe'
        shell: pwsh
        run: |
          # Runner imajında NSIS olmayabilir; kurulum çıktısı görünür kalsın, makensis yolu aranarak bulunur
          function Find-Makensis { @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", (Get-Command makensis -ErrorAction SilentlyContinue).Source) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1 }
          $mk = Find-Makensis
          if (-not $mk) { choco install nsis -y --no-progress; $mk = Find-Makensis }
          # choco deposu çökükse (503) taşınabilir NSIS zip'i SourceForge'dan
          if (-not $mk) {
            Invoke-WebRequest -UserAgent "Wget" -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" -OutFile "$env:RUNNER_TEMP\nsis.zip"
            Expand-Archive "$env:RUNNER_TEMP\nsis.zip" -DestinationPath "$env:RUNNER_TEMP\nsis"
            $mk = "$env:RUNNER_TEMP\nsis\nsis-3.10\makensis.exe"
          }
          if (-not $mk) { throw "makensis.exe bulunamadı" }
          Write-Host "makensis: $mk"
          $v = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force dist/win/app | Out-Null
          foreach ($d in 'bin','server','web','workspace','scripts','package.json','package-lock.json','LICENSE','README.md') { if (Test-Path $d) { Copy-Item -Recurse $d dist/win/app/ } }
          Push-Location dist/win/app; npm ci --omit=dev --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { npm ci --omit=dev --ignore-scripts --no-audit --no-fund }; Pop-Location
          Copy-Item (Get-Command node).Source dist/win/node.exe
          Copy-Item packaging/windows/kmy-terminal.cmd dist/win/
          & $mk /DVERSION=$v /DSRC=dist\win packaging\windows\kmy-terminal.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis başarısız ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kmy-terminal-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*-setup.exe
          if-no-files-found: error

  # Etiket (v*) gelince dosyaları TASLAK release'e ekler; yayımlamaz.
  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out, merge-multiple: true }
      - name: Taslak release'e yükle
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --draft --title "kmy terminal ${tag#v}" --notes "Taslak" -R "$GITHUB_REPOSITORY"
          gh release upload "$tag" out/* --clobber -R "$GITHUB_REPOSITORY"
