name: Pages
# Tanıtım sayfası (site/) + Sparkle appcast'i (/appcast.xml) → GitHub Pages. Önkoşul: Settings › Pages › Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  # Sürüm yayımlanınca (taslaktan çıkınca) appcast güncellenir
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # github-pages ortamı yalnız main'den dağıtıma izin veriyor; release olayı etiket ref'inde çalışır.
  # Bu yüzden yayım olayı, main üzerinde workflow_dispatch tetikler (GITHUB_TOKEN buna izinlidir).
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps:
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # En yeni yayımlanmış (ön sürüm dahil, taslak hariç) sürümün appcast.xml'i; imzalı SHA256SUMS ile doğrulanır
      - name: Sparkle appcast'i ekle
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[] | select(.draft|not) | select([.assets[].name] | index("appcast.xml"))][0].tag_name // empty')"
          [ -n "$tag" ] || { echo "::warning::appcast.xml içeren yayımlanmış sürüm yok"; exit 0; }
          d="$RUNNER_TEMP/ac"; mkdir -p "$d"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$d" -p appcast.xml -p SHA256SUMS -p SHA256SUMS.sig
          node -e 'const s=require("fs").readFileSync("server/update-key.js","utf8");process.stdout.write(/`(-----BEGIN PUBLIC KEY-----[\s\S]+?-----END PUBLIC KEY-----)`/.exec(s)[1])' > "$d/pub.pem"
          base64 -d "$d/SHA256SUMS.sig" > "$d/sig.bin"
          openssl pkeyutl -verify -pubin -inkey "$d/pub.pem" -rawin -in "$d/SHA256SUMS" -sigfile "$d/sig.bin"
          (cd "$d" && grep ' appcast.xml$' SHA256SUMS | sha256sum -c -)
          cp "$d/appcast.xml" site/appcast.xml
          echo "appcast: $tag"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
