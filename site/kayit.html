<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kmy terminal — beta kaydı (taslak)</title>
<style>body{margin:0;font:16px/1.6 system-ui,sans-serif;background:#0d0f12;color:#e8e8e8}main{max-width:560px;margin:auto;padding:48px 20px}
label{display:block;margin-top:14px}input,select,textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#16191d;color:inherit}
button{margin-top:18px;padding:10px 18px;border:0;border-radius:8px;background:#ff9f0a;font-weight:600}.muted{color:#9aa0a6;font-size:14px}</style></head>
<body><main>
<h1>Beta'ya kaydol</h1>
<p class="muted">TASLAK: form henüz bir yere gönderilmiyor. Yayından önce <code>action</code> adresi (ör. Google Forms / Formspree / kendi uç noktanız) ve KVKK aydınlatma metni bağlantısı eklenmeli.</p>
<form action="#" method="post" onsubmit="alert('Taslak form: henüz gönderim yapılmıyor.');return false;">
<label>Ad (isteğe bağlı)<input name="ad" autocomplete="name"></label>
<label>E-posta *<input name="eposta" type="email" required autocomplete="email"></label>
<label>İşletim sistemi<select name="os"><option>macOS (Apple Silicon)</option><option>macOS (Intel)</option><option>Windows</option><option>Linux</option></select></label>
<label>Ne için kullanmak istersiniz?<textarea name="not" rows="3"></textarea></label>
<label><input type="checkbox" name="kvkk" required style="width:auto"> Beta duyuruları için e-posta adresimin işlenmesini kabul ediyorum (KVKK aydınlatma metni: <i>eklenecek</i>).</label>
<label><input type="checkbox" name="tavsiye" required style="width:auto"> Uygulamanın yatırım tavsiyesi olmadığını anlıyorum.</label>
<button type="submit">Kaydol</button>
</form>
<p><a href="index.html" style="color:#ff9f0a">← Geri</a></p>
</main></body></html>
