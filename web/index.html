<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KMY Terminal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0e13">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/settings.css">
  <script src="/vendor/chart.js"></script>
  <script src="/vendor/chartjs-adapter-date-fns.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-narrow" id="btnLeft" aria-label="Watchlist'i aç">☰</button>
    <div class="brand" title="KMY Terminal">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 17l5-6 4 4 8-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>KMY<b>TERMINAL</b></span>
    </div>
    <div class="ticker" aria-label="Piyasa şeridi"><div class="ticker-track" id="ticker"></div></div>
    <div class="topbar-right">
      <span class="mkt-status" id="mktStatus"></span>
      <span class="clock" id="clock"></span>
      <span class="conn" id="conn" title="Sunucu bağlantısı"></span>
      <button class="icon-btn" id="btnPalette" title="Sembol ara (⌘K)" aria-label="Sembol ara">⌕</button>
      <button class="icon-btn" id="btnInstall" title="Masaüstüne uygulama olarak kur" aria-label="Uygulama olarak kur" hidden>⤓</button>
      <button class="icon-btn" id="btnSettings" title="Ayarlar" aria-label="Ayarlar">⚙</button>
      <button class="icon-btn only-narrow" id="btnRight" aria-label="Sağ paneli aç">☷</button>
    </div>
  </header>

  <nav class="viewbar" role="tablist">
    <button role="tab" data-view="agent" class="active">TERMINAL</button>
    <button role="tab" data-view="market">DASHBOARD</button>
    <button role="tab" data-view="portfolio">PORTFÖY</button>
    <span class="spacer"></span>
    <button class="ghost" id="btnToggleRight" title="Sağ paneli gizle/göster">PANEL ▸</button>
  </nav>

  <main class="layout" id="layout">
    <aside class="left" id="left">
      <div class="panel-head">
        <span title="BIST fiyatları ~15 dk gecikmeli; döviz ve altın serbest piyasa (~1 dk)">WATCHLIST</span>
        <div class="head-actions">
          <button class="icon-btn sm" id="wlSort" title="Sırala">⇅</button>
        </div>
      </div>
      <form class="wl-add" id="wlAddForm" autocomplete="off">
        <input id="wlAddInput" placeholder="Sembol ekle (THYAO, USDTRY, GRAM…)" aria-label="Sembol ekle">
        <div class="suggest" id="wlSuggest" hidden></div>
      </form>
      <div class="wl" id="watchlist" role="list"></div>
      <div class="left-foot" id="dataFoot" title="Veri kaynakları">
        <div><span class="dot delayed"></span>BIST hisse ve endeksleri: ~15 dk gecikmeli (Yahoo)</div>
        <div><span class="dot live"></span>Döviz ve altın: serbest piyasa, ~1 dk (Truncgil)</div>
        <div><span class="dot live"></span>KAP: anlık · Temel veriler, mali tablolar: İş Yatırım</div>
        <div><span class="dot live"></span>Kurum raporları: 12 kurumun açık yayınları · Haberler: 7 RSS</div>
      </div>
    </aside>
    <div class="splitter" data-split="left" aria-hidden="true"></div>

    <section class="center" id="center">
      <div class="view active" id="view-agent">
        <div class="agent-head"><span class="agent-title">AGENT CHAT</span><span class="spacer"></span><span class="head-actions" id="agentActions"></span>
          <div class="seg" id="agentMode"><button data-m="chat" class="active">CHAT</button><button data-m="terminal" title="Kabuk ve Claude Code (xterm)">TERMINAL</button></div>
        </div>
        <div class="agent-body"><div class="agent-pane active" id="agentChat"></div><div class="agent-pane" id="agentTerm"></div></div>
      </div>
      <div class="view" id="view-market"></div>
      <div class="view" id="view-portfolio"></div>
    </section>

    <div class="splitter" data-split="right" aria-hidden="true"></div>
    <aside class="right" id="right">
      <div class="right-tabs" role="tablist">
        <button role="tab" data-rtab="kap" class="active">KAP <span class="badge" id="kapBadge" hidden></span></button>
        <button role="tab" data-rtab="reports">RAPORLAR</button>
        <button role="tab" data-rtab="pdf" hidden>PDF <span class="tab-x" id="pdfClose" title="Kapat" aria-label="PDF sekmesini kapat">✕</span></button>
        <button class="icon-btn sm only-narrow" id="btnRightClose" aria-label="Paneli kapat">✕</button>
      </div>
      <div class="rtab active" id="rtab-kap"></div>
      <div class="rtab" id="rtab-reports"></div>
      <div class="rtab" id="rtab-pdf"></div>
    </aside>
  </main>
  <div class="backdrop" id="backdrop" hidden></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
